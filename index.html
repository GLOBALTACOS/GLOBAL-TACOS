<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBALTACOS - Leaflet.js 50-Country Interactive Map ($2.50 USD Base)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; height: 50px; flex-shrink: 0; z-index: 1000; }
    .logo { font-size: 1.2rem; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 6px; }
    .controls { display: flex; gap: 8px; align-items: center; }
    select, button { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    select:hover, button:hover { border-color: #f59e0b; }

    .main-container { display: flex; flex: 1; height: calc(100vh - 50px); width: 100vw; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; width: 100%; background: #0f172a; z-index: 1; }

    .sidebar { width: 360px; background: #1e293b; border-left: 1px solid #334155; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-shrink: 0; z-index: 2; }

    .attribution-badge { font-size: 0.75rem; color: #94a3b8; background: #0f172a; border: 1px solid #334155; padding: 2px 8px; border-radius: 4px; display: inline-flex; align-items: center; }
    .fx-link { color: #38bdf8; text-decoration: underline; }
    .fx-link:hover { color: #7dd3fc; }

    /* レスポンシブ対応：スマホ縦画面でのレイアウト */
    @media (max-width: 768px) {
      body { overflow-y: auto; }
      header { height: auto; padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
      .main-container { flex-direction: column; height: auto; width: 100%; overflow: visible; }
      #map { height: 45vh; min-height: 300px; width: 100%; flex: none; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid #334155; height: auto; overflow-y: visible; }
    }
    
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; color: #f59e0b; }
    
    .fx-panel { background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; padding: 10px; border-radius: 8px; }
    .fx-info { font-size: 0.85rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 0.7rem; background: #10b981; color: #fff; padding: 2px 6px; border-radius: 4px; }
    
    .data-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #cbd5e1; margin: 6px 0; }
    .highlight-val { color: #38bdf8; font-weight: bold; }
    
    .game-box { background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 10px; margin-top: 8px; text-align: center; }
    .taco-count { font-size: 1.25rem; font-weight: bold; color: #10b981; margin: 4px 0; }

    .ranking-list { list-style: none; padding: 0; margin: 0; }
    .ranking-item { display: flex; justify-content: space-between; padding: 8px; font-size: 0.85rem; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.15s; }
    .ranking-item:hover { background: #334155; }

    /* Leaflet Custom Pins */
    .custom-pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
    .pin-over { background: #ef4444; }
    .pin-under { background: #3b82f6; }
    .pin-base { background: #10b981; }
  </style>
</head>

        <option value="es">🇲🇽 Español</option>

          <button onclick="fetchFxRate()" id="btnReload" style="font-size:0.65rem; padding:2px 6px;">手動更新</button>
        </div>
      </div>

      <!-- 国詳細 & シミュレーター -->
      <div id="detailBox" class="card">
        <div id="placeholderText" style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 12px 0;">

      { id: 'GR', lat: 39.0742, lng: 21.8243, currency: 'EUR', localPrice: 3.10, name: { ja: 'ギリシャ', en: 'Greece', es: 'Grecia' }, note: { ja: '南欧の標準的観光都市物価。', en: 'Standard Southern European tourist prices.', es: 'Precios turísticos del sur de Europa.' } },
      { id: 'PT', lat: 39.3999, lng: -8.2245, currency: 'EUR', localPrice: 3.00, name: { ja: 'ポルトガル', en: 'Portugal', es: 'Portugal' }, note: { ja: '西欧の中では比較的割安。', en: 'Relatively affordable within Western Europe.', es: 'Relativamente económico en Europa Occidental.' } },
      { id: 'IE', lat: 53.4129, lng: -8.2439, currency: 'EUR', localPrice: 4.50, name: { ja: 'アイルランド', en: 'Ireland', es: 'Irlanda' }, note: { ja: '急増する生活コストを反映。', en: 'Reflects rapidly rising cost of living.', es: 'Refleja el rápido aumento en el costo de vida.' } },
      { id: 'FI', lat: 61.9241, lng: 25.7482, currency: 'EUR', localPrice: 4.70, name: { ja: 'フィンランド', en: 'Finland', es: 'Finlandia' }, note: { ja: '北欧特有の高い税制と物価。', en: 'Nordic taxation and price structure.', es: 'Estructura nórdica de impuestos y precios.' } },
      { id: 'DK', lat: 56.2639, lng: 9.5018, currency: 'DKK', localPrice: 37.0, name: { ja: 'デンマーク', en: 'Denmark', es: 'Dinamarca' }, note: { ja: '欧州内でもトップクラスの高価格。', en: 'Among the highest price points in Europe.', es: 'Entre los precios más altos de Europa.' } },
      { id: 'AT', lat: 47.5162, lng: 14.5501, currency: 'EUR', localPrice: 3.80, name: { ja: 'オーストリア', en: 'Austria', es: 'Austria' }, note: { ja: '中欧の上位物価水準。', en: 'Upper-range Central European prices.', es: 'Precios altos en Europa Central.' } },
      { id: 'BE', lat: 50.5039, lng: 4.4699, currency: 'EUR', localPrice: 3.90, name: { ja: 'ベルギー', en: 'Belgium', es: 'Bélgica' }, note: { ja: 'EU主要国の標準的外食費。', en: 'Standard cost for core EU nations.', es: 'Costo estándar en países clave de la UE.' } },
      { id: 'CZ', lat: 49.8175, lng: 15.4730, currency: 'CZK', localPrice: 65.0, name: { ja: 'チェコ', en: 'Czechia', es: 'República Checa' }, note: { ja: '観光都市プラハを中心に高め。', en: 'Higher prices centered around Prague.', es: 'Precios más altos enfocados en Praga.' } },
      { id: 'HU', lat: 47.1625, lng: 19.5033, currency: 'HUF', localPrice: 950.0, name: { ja: 'ハンガリー', en: 'Hungary', es: 'Hungría' }, note: { ja: 'メキシコ標準に近い中欧物価。', en: 'Central European price close to base.', es: 'Precio en Europa Central cercano a la base.' } },
      { id: 'IL', lat: 31.0461, lng: 34.8516, currency: 'ILS', localPrice: 19.0, name: { ja: 'イスラエル', en: 'Israel', es: 'Israel' }, note: { ja: 'テルアビブ等で世界最高レベルの物価。', en: 'World-class high cost in Tel Aviv.', es: 'Costo de vida muy alto en Tel Aviv.' } },
      { id: 'BD', lat: 23.6850, lng: 90.3563, currency: 'BDT', localPrice: 140.0, name: { ja: 'バングラデシュ', en: 'Bangladesh', es: 'Bangladés' }, note: { ja: 'アジア最大級の割安国。', en: 'One of the most affordable in Asia.', es: 'Uno de los más económicos de Asia.' } }
    ];

    let countries = [];
    let map = null, markers = [];
    let currentUsdJpyRate = 150.0;
    let currentLang = 'ja';
    let currentSelectedCountry = null;

    window.onload = () => {
      // Leaflet地図初期化
      map = L.map('map').setView([20, 0], 2);
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        attribution: '&copy; 国土地理院の地理院タイルを加工して作成', maxZoom: 18
      }).addTo(map);

      // 地図描画サイズの確定
      setTimeout(() => { if (map) map.invalidateSize(); }, 200);

      window.addEventListener('resize', () => {
        if (map) map.invalidateSize();
      });

      fetchFxRate();
    };

    // 無料APIからリアルタイム為替レートを取得し、メキシコ($2.50)以外の全49カ国のタコス価格と割安/割高をリアルタイム計算
    async function fetchFxRate() {
      const statusEl = document.getElementById('apiStatus');
      statusEl.innerText = 'SYNC';
      statusEl.style.background = '#f59e0b';

      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        
        if (data && data.rates && data.rates.JPY) {
          const rates = data.rates;
          currentUsdJpyRate = rates.JPY;
          document.getElementById('fxRateVal').innerText = `1 USD = ${currentUsdJpyRate.toFixed(2)} JPY`;
          statusEl.innerText = 'ONLINE';
          statusEl.style.background = '#10b981';

          countries = rawCountries.map(c => {
            if (c.id === 'MX') {
              // メキシコだけ $2.50 USD に完全固定
              return { ...c, priceUsd: BASE_MEXICO_USD };
            }
            // 他国は現地通貨価格をリアルタイム為替レートで割ってUSD価格を算出
            const fxRate = rates[c.currency] || 1;
            const priceUsd = c.localPrice / fxRate;
            return { ...c, priceUsd: priceUsd };
          });
        } else {
          throw new Error('Rate unavailable');
        }
      } catch (err) {
        document.getElementById('fxRateVal').innerText = `1 USD = ${currentUsdJpyRate.toFixed(2)} JPY (Fix)`;
        statusEl.innerText = 'OFFLINE';
        statusEl.style.background = '#ef4444';

        // オフライン時のフォールバック計算
        const fallbackRates = { USD: 1, JPY: currentUsdJpyRate, EUR: 0.92, GBP: 0.79, CAD: 1.38, BRL: 5.4, ARS: 980, KRW: 1380, CNY: 7.2, THB: 34.5, INR: 84, CHF: 0.88, EGP: 48.5, AUD: 1.52, NZD: 1.66, ZAR: 17.8, NGN: 1600, KES: 129, SEK: 10.6, NOK: 10.9, PLN: 4.0, RUB: 96, TRY: 34.2, SAR: 3.75, AED: 3.67, IDR: 15600, MYR: 4.35, SGD: 1.33, PHP: 58, VND: 25300, PKR: 278, CLP: 950, COP: 4250, PEN: 3.75, DKK: 6.86, CZK: 23.3, HUF: 370, ILS: 3.75, BDT: 119 };
        countries = rawCountries.map(c => ({
          ...c,
          priceUsd: c.id === 'MX' ? BASE_MEXICO_USD : c.localPrice / (fallbackRates[c.currency] || 1)
        }));
      }

      if (!currentSelectedCountry) {
        currentSelectedCountry = countries.find(c => c.id === 'MX') || countries[0];
      } else {
        currentSelectedCountry = countries.find(c => c.id === currentSelectedCountry.id) || countries[0];
      }

      updateView();
      if (currentSelectedCountry) showDetail(currentSelectedCountry);
    }

    // 言語切り替え
    function changeLanguage() {
      currentLang = document.getElementById('langSelect').value;
      const t = i18n[currentLang];

      document.getElementById('headerAttribution').innerText = t.headerAttribution;
      document.getElementById('optAll').innerText = t.optAll;
      document.getElementById('optOver').innerText = t.optOver;
      document.getElementById('optUnder').innerText = t.optUnder;
      document.getElementById('labelFx').innerText = t.labelFx;
      document.getElementById('btnReload').innerText = t.btnReload;
      document.getElementById('labelRanking').innerText = t.labelRanking;

      updateView();
      if (currentSelectedCountry) showDetail(currentSelectedCountry);
    }

    // マップ上のピン再描画 & ランキングリスト更新
    function updateView() {
      const filter = document.getElementById('filterSelect').value;
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtered = countries.filter(c => {
        if (filter === 'over') return c.id !== 'MX' && c.priceUsd > BASE_MEXICO_USD;
        if (filter === 'under') return c.id !== 'MX' && c.priceUsd < BASE_MEXICO_USD;
        return true;
      });

      filtered.forEach(c => {
        let cls = 'pin-base';
        if (c.id !== 'MX') {
          if (c.priceUsd > BASE_MEXICO_USD) cls = 'pin-over';
          if (c.priceUsd < BASE_MEXICO_USD) cls = 'pin-under';
        }

        const icon = L.divIcon({
          className: '',
          html: `<div class="custom-pin ${cls}"></div>`,
          iconSize: [14, 14]
        });

        const m = L.marker([c.lat, c.lng], { icon: icon }).addTo(map);
        m.on('click', () => showDetail(c));
        markers.push(m);
      });

      renderRanking(filtered);
    }

    // 国詳細カード＆シミュレーター表示
    function showDetail(c) {
      currentSelectedCountry = c;
      const t = i18n[currentLang];
      
      const priceJpy = Math.round(c.priceUsd * currentUsdJpyRate);
      const budgetUsd = 1000;
      const tacosBuyable = Math.floor(budgetUsd / c.priceUsd);
      const pppRatio = ((c.priceUsd / BASE_MEXICO_USD) * 100).toFixed(0);

      const countryName = c.name[currentLang] || c.name.en;
      const countryNote = c.note[currentLang] || c.note.en;
      const tagText = c.id === 'MX' ? t.baseTag : (c.priceUsd > BASE_MEXICO_USD ? t.overTag : t.underTag);

      document.getElementById('detailBox').innerHTML = `
        <div class="card-title">
          <span>${countryName}</span>
          <span style="font-size:0.8rem;">${tagText}</span>
        </div>
        <div class="data-row"><span>${t.priceUsd}</span><b class="highlight-val">$${c.priceUsd.toFixed(2)}</b></div>
        <div class="data-row"><span>${t.priceJpy}</span><b style="color:#f59e0b;">約 ${priceJpy.toLocaleString()} 円</b></div>
        <div class="data-row"><span>${t.pppRatio}</span><b>${pppRatio}%</b></div>
        
        <div class="game-box">
          <div style="font-size:0.75rem; color:#cbd5e1;">${t.travelTitle}</div>
          <div class="taco-count">🌮 ${tacosBuyable.toLocaleString()} ${t.buyable}</div>
          <div style="font-size:0.7rem; color:#94a3b8; margin-top:2px;">
            ${tacosBuyable < 400 ? t.highText : t.lowText}
          </div>
        </div>

        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 10px; border-top: 1px dashed #334155; padding-top: 8px;">
          ${t.noteTitle}<br>${countryNote}
        </div>
      `;
      map.panTo([c.lat, c.lng]);
    }

    // 50カ国ランキング一覧描画
    function renderRanking(list) {
      const sorted = [...list].sort((a, b) => b.priceUsd - a.priceUsd);
      const rankingEl = document.getElementById('rankingList');
      rankingEl.innerHTML = '';

      sorted.forEach((c, idx) => {
        const priceJpy = Math.round(c.priceUsd * currentUsdJpyRate);
        const countryName = c.name[currentLang] || c.name.en;
        const li = document.createElement('li');
        li.className = 'ranking-item';
        li.onclick = () => showDetail(c);
        li.innerHTML = `
          <span><b>${idx+1}.</b> ${countryName}</span>
          <span><b>$${c.priceUsd.toFixed(2)}</b> <small style="color:#94a3b8;">(${priceJpy.toLocaleString()}円)</small></span>
        `;
        rankingEl.appendChild(li);
      });
    }
  </script>
</body>
</html>
