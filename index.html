      
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBALTACOS - Leaflet.js 50-Country Interactive Map ($2.50 USD Base)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; height: 50px; flex-shrink: 0; z-index: 1000; }
    .logo { font-size: 1.2rem; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 6px; }
    .controls { display: flex; gap: 8px; align-items: center; }
    select, button { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    select:hover, button:hover { border-color: #f59e0b; }

    .main-container { display: flex; flex: 1; height: calc(100vh - 50px); width: 100vw; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; width: 100%; background: #0f172a; z-index: 1; }

    .sidebar { width: 360px; background: #1e293b; border-left: 1px solid #334155; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-shrink: 0; z-index: 2; }

    .attribution-badge { font-size: 0.75rem; color: #94a3b8; background: #0f172a; border: 1px solid #334155; padding: 2px 8px; border-radius: 4px; display: inline-flex; align-items: center; }
    .fx-link { color: #38bdf8; text-decoration: underline; }
    .fx-link:hover { color: #7dd3fc; }

    /* レスポンシブ対応：スマホ縦画面でのレイアウト */
    @media (max-width: 768px) {
      body { overflow-y: auto; }
      header { height: auto; padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
      .main-container { flex-direction: column; height: auto; width: 100%; overflow: visible; }
      #map { height: 45vh; min-height: 300px; width: 100%; flex: none; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid #334155; height: auto; overflow-y: visible; }
    }
   
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; color: #f59e0b; }
   
    .fx-panel { background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; padding: 10px; border-radius: 8px; }
    .fx-info { font-size: 0.85rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 0.7rem; background: #10b981; color: #fff; padding: 2px 6px; border-radius: 4px; }
   
    .data-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #cbd5e1; margin: 6px 0; }
    .highlight-val { color: #38bdf8; font-weight: bold; }
   
    .game-box { background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 10px; margin-top: 8px; text-align: center; }
    .taco-count { font-size: 1.25rem; font-weight: bold; color: #10b981; margin: 4px 0; }

    .ranking-list { list-style: none; padding: 0; margin: 0; }
    .ranking-item { display: flex; justify-content: space-between; padding: 8px; font-size: 0.85rem; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.15s; }
    .ranking-item:hover { background: #334155; }

    /* Leaflet Custom Pins */
    .custom-pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
    .pin-over { background: #ef4444; }
    .pin-under { background: #3b82f6; }
    .pin-base { background: #10b981; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <div class="logo">🌮 GLOBALTACOS</div>
      <span class="attribution-badge" id="headerAttribution">出典：国土地理院の地理院タイルを加工して作成</span>
    </div>
    <div class="controls">
      <!-- 言語切替 -->
      <select id="langSelect" onchange="changeLanguage()">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇺🇸 English</option>
        <option value="es">🇲🇽 Español</option>
      </select>
      <!-- フィルター切替 -->
      <select id="filterSelect" onchange="updateView()">
        <option value="all" id="optAll">全50カ国</option>
        <option value="over" id="optOver">割高 (赤)</option>
        <option value="under" id="optUnder">割安 (青)</option>
      </select>
    </div>
  </header>

  <div class="main-container">
    <div id="map"></div>
   
    <div class="sidebar">
      <!-- 為替パネル -->
      <div class="fx-panel">
        <div class="fx-info">
          <span id="labelFx">🌐 リアルタイム為替:</span>
          <span id="fxRateVal" style="color:#f59e0b;">取得中...</span>
        </div>
        <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 6px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;">
          <span>API: <span id="apiStatus" class="status-badge">ONLINE</span> (<a href="https://www.exchangerate-api.com/" target="_blank" rel="noopener noreferrer" class="fx-link">Rates By Exchange Rate API</a>)</span>
          <button onclick="fetchFxRate()" id="btnReload" style="font-size:0.65rem; padding:2px 6px;">手動更新</button>
        </div>
      </div>

      <!-- 国詳細 & シミュレーター -->
      <div id="detailBox" class="card">
        <div id="placeholderText" style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 12px 0;">
          ピンまたは国リストを選択すると詳細が表示されます。
        </div>
      </div>

      <!-- ランキング -->
      <div id="labelRanking" style="font-weight: bold; font-size: 0.9rem; color: #94a3b8; margin-top: 4px;">
        タコス物価指数ランキング (日本円換算)
      </div>
      <ul class="ranking-list" id="rankingList"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
